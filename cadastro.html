 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>

    <h1>Formulário de Cadastro</h1>

    <form>
        <div>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="usuario_nome" placeholder="Digite seu nome completo">
        </div>
        <br>

        <div>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="usuario_email" placeholder="seuemail@dominio.com">
        </div>
        <br>

        <div>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="usuario_senha" placeholder="Digite sua senha">
        </div>
        <br>

        <button type="submit">
            Cadastrar
        </button>
    </form>

</body>
</html>   
</body>
</html>
