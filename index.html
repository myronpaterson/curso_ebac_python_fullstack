<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Números</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <h1>Validador Numérico</h1>
        <form id="form-validador">
            <div class="form-field">
                <label for="campo-a">Número A:</label>
                <input type="number" id="campo-a" required placeholder="Digite o primeiro número">
            </div>
            <div class="form-field">
                <label for="campo-b">Número B:</label>
                <input type="number" id="campo-b" required placeholder="Digite o segundo número">
            </div>
            <button type="submit">Validar</button>
        </form>
        <p class="feedback-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
